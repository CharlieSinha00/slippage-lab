[project]
name = "slippage-lab"
version = "0.1.0"
description = "Execution cost analysis on a synthetic tape: interval VWAP versus implementation shortfall."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Soumyadeep Sinha" }]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1,<3",
    "pandas>=2.2,<3",
]

[project.scripts]
slippage-lab = "slippage_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "ruff>=0.14,<0.15",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/slippage_lab"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "N", "PT"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
